<template>
    <lightning-card
        title="Cinema Subsidy Dashboard"
        icon-name="standard:money">

        <div class="slds-p-around_medium">

            <!-- Dashboard Summary -->
            <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_large">

                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-box">
                        <div class="slds-text-title">
                            Total Requests
                        </div>
                        <div class="slds-text-heading_medium">
                            {totalRequests}
                        </div>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-box">
                        <div class="slds-text-title">
                            Pending
                        </div>
                        <div class="slds-text-heading_medium">
                            {pendingRequests}
                        </div>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-box">
                        <div class="slds-text-title">
                            Approved
                        </div>
                        <div class="slds-text-heading_medium">
                            {approvedRequests}
                        </div>
                    </div>
                </div>

            </div>

            <!-- Request Additional Subsidy -->
            <div class="slds-m-bottom_large">

                <lightning-button
                    label="Request Additional Subsidy"
                    variant="brand"
                    onclick={handleShowRequestForm}>
                </lightning-button>

            </div>

            <!-- Subsidy Request Form -->
            <template if:true={showRequestForm}>

                <div class="slds-box slds-m-bottom_large">

                    <h2 class="slds-text-heading_small slds-m-bottom_medium">
                        Request Additional Subsidy
                    </h2>

                    <lightning-record-edit-form
                        object-api-name="Subsidy_Assignment__c"
                        onsuccess={handleRequestSuccess}>

                        <lightning-messages>
                        </lightning-messages>

                        <lightning-input-field
                            field-name="Permit_Application__c"
                            required>
                        </lightning-input-field>

                        <lightning-input-field
                            field-name="Request_Type__c"
                            required>
                        </lightning-input-field>

                        <lightning-input-field
                            field-name="Requested_Amount__c"
                            required>
                        </lightning-input-field>

                        <lightning-input-field
                            field-name="Notes__c">
                        </lightning-input-field>

                        <div class="slds-m-top_medium">

                            <lightning-button
                                variant="brand"
                                type="submit"
                                label="Submit Request">
                            </lightning-button>

                            <lightning-button
                                label="Cancel"
                                onclick={handleCancelRequest}
                                class="slds-m-left_small">
                            </lightning-button>

                        </div>

                    </lightning-record-edit-form>

                </div>

            </template>

            <!-- Subsidy Requests -->
            <template if:true={hasSubsidies}>

                <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                    Subsidy Requests by Category
                </h2>

                <template
                    for:each={subsidyGroups}
                    for:item="group">

                    <div
                        key={group.category}
                        class="slds-box slds-m-bottom_medium">

                        <h3 class="slds-text-heading_small slds-m-bottom_small">
                            {group.category}
                        </h3>

                        <template
                            for:each={group.records}
                            for:item="subsidy">

                            <div
                                key={subsidy.id}
                                class="slds-box slds-m-bottom_small">

                                <div class="slds-grid slds-wrap slds-gutters">

                                    <div class="slds-col slds-size_1-of-2">

                                        <div class="slds-text-title">
                                            Requested Amount
                                        </div>

                                        <lightning-formatted-number
                                            value={subsidy.requestedAmount}
                                            format-style="currency"
                                            currency-code="INR">
                                        </lightning-formatted-number>

                                    </div>

                                    <div class="slds-col slds-size_1-of-2">

                                        <div class="slds-text-title">
                                            Approved Amount
                                        </div>

                                        <lightning-formatted-number
                                            value={subsidy.approvedAmount}
                                            format-style="currency"
                                            currency-code="INR">
                                        </lightning-formatted-number>

                                    </div>

                                </div>

                                <div class="slds-m-top_small">

                                    <span class="slds-text-title">
                                        Workflow Status:
                                    </span>

                                    <lightning-badge
                                        label={subsidy.status}>
                                    </lightning-badge>

                                </div>

                                <template if:true={subsidy.eligibility}>

                                    <div class="slds-m-top_small">
                                        <span class="slds-text-title">
                                            Eligibility:
                                        </span>
                                        Eligible
                                    </div>

                                </template>

                            </div>

                        </template>

                    </div>

                </template>

            </template>

            <template if:false={hasSubsidies}>

                <div class="slds-text-align_center slds-p-around_medium">
                    No subsidy requests found.
                </div>

            </template>

        </div>

    </lightning-card>
</template>
